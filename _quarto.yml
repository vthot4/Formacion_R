project:
  type: book
  output-dir: _book

book:
  title: "Formación en R: modelos estadísticos"
  author: "Formación R"
  date: today
  output-file: formacion-r
  site-url: https://vthot4.github.io/Formacion_R/
  repo-url: https://github.com/vthot4/Formacion_R
  downloads: [pdf]
  sidebar:
    search: true
  chapters:
    - index.qmd
    - temas/01-introduccion-r/tema.qmd
    - temas/02-estadistica-descriptiva/tema.qmd
    - temas/03-variables-aleatorias/tema.qmd
    - temas/04-modelos-probabilidad/tema.qmd
    - temas/05-transformaciones-simulacion/tema.qmd
    - temas/06-vectores-aleatorios/tema.qmd
    - temas/07-operaciones-limites/tema.qmd
    - temas/08-estimacion/tema.qmd
    - temas/09-contrastes/tema.qmd
    - temas/10-regresion/tema.qmd
    - temas/11-modelos-lineales-generalizados/tema.qmd
    # --- Añade aquí los nuevos temas (ver plantillas/tema/) ---

lang: es

execute:
  warning: false
  message: false

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-copy: true
  pdf:
    documentclass: scrbook
    classoption: oneside
    pdf-engine: xelatex
    papersize: a4
    fontsize: 11pt
    toc: true
    number-sections: true
    colorlinks: true
    geometry:
      - margin=2.5cm
    include-in-header: estilos/print.tex
