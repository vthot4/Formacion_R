project:
  type: book
  output-dir: _book

book:
  title: "Formación en R: estadística básica"
  author: "Formación R"
  date: today
  output-file: formacion-r
  chapters:
    - index.qmd
    - part: "Tema 1. Introducción a R"
      chapters:
        - temas/01-introduccion-r/teoria.qmd
        - temas/01-introduccion-r/laboratorio.qmd
    - part: "Tema 2. Estadística descriptiva"
      chapters:
        - temas/02-estadistica-descriptiva/teoria.qmd
        - temas/02-estadistica-descriptiva/laboratorio.qmd
    - part: "Tema 3. Probabilidad y distribuciones"
      chapters:
        - temas/03-probabilidad/teoria.qmd
        - temas/03-probabilidad/laboratorio.qmd
    - part: "Tema 4. Inferencia estadística"
      chapters:
        - temas/04-inferencia/teoria.qmd
        - temas/04-inferencia/laboratorio.qmd
    - part: "Tema 5. Correlación y regresión"
      chapters:
        - temas/05-regresion/teoria.qmd
        - temas/05-regresion/laboratorio.qmd
    # --- Añade aquí los nuevos temas (ver plantillas/tema/) ---

lang: es

execute:
  freeze: auto
  warning: false
  message: false

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-copy: true
  pdf:
    documentclass: scrbook
    classoption: oneside
    pdf-engine: xelatex
    papersize: a4
    fontsize: 11pt
    toc: true
    number-sections: true
    colorlinks: true
    geometry:
      - margin=2.5cm
    include-in-header: estilos/print.tex
